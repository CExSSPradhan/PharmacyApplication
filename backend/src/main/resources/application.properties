# Secrets are supplied by environment variables or external Spring configuration.
server.port=${PORT:8080}
server.shutdown=graceful
server.max-http-request-header-size=16KB
spring.application.name=pharmacy
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55432/pharmacy}
spring.datasource.username=${DB_USER:pharmacy}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.connection-timeout=5000
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=200ms
spring.data.redis.timeout=200ms
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${RABBITMQ_USER:pharmacy}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.connection-timeout=1s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.auto-startup=${MESSAGING_ENABLED:false}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.lifecycle.timeout-per-shutdown-phase=20s
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.redis.enabled=${REDIS_ENABLED:false}
management.health.rabbit.enabled=${MESSAGING_ENABLED:false}
logging.structured.format.console=logstash
app.redis-enabled=${REDIS_ENABLED:false}
app.messaging-enabled=${MESSAGING_ENABLED:false}
app.seed-demo=${SEED_DEMO:false}
app.owner-email=${OWNER_EMAIL:}
app.owner-password=${OWNER_PASSWORD:}

# Authentication and operational settings
app.metrics-token=${METRICS_TOKEN:}
app.session-ttl=${SESSION_TTL:8h}
app.cache-ttl=${CACHE_TTL:5m}
app.login-rate-limit=${LOGIN_RATE_LIMIT:20}
app.api-rate-limit=${API_RATE_LIMIT:600}
app.outbox-publish-delay=${OUTBOX_PUBLISH_DELAY:10000}
app.maintenance-delay=${MAINTENANCE_DELAY:3600000}
