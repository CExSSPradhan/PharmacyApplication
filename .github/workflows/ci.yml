name: Verify pharmacy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Integration and concurrency tests on PostgreSQL 18
        run: mvn -B -f backend/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/target/surefire-reports
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run test && npm run build
      - run: npm audit --audit-level=moderate
  containers-and-e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node scripts/init-env.mjs
      - run: docker compose --env-file .env -f infra/docker-compose.yml up -d --build --wait --wait-timeout 240
      - run: npm ci --prefix frontend
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: npm --prefix frontend run test:e2e
        env:
          E2E_URL: http://localhost:8088
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: pharmacy-backend:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: pharmacy-frontend:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Logs
        if: always()
        run: docker compose --env-file .env -f infra/docker-compose.yml logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-and-container-results
          path: |
            frontend/playwright-report
            frontend/test-results
            compose.log
      - if: always()
        run: docker compose --env-file .env -f infra/docker-compose.yml down
