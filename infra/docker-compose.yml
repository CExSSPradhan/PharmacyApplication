name: pharmacy
services:
  postgres:
    image: postgres:18.1
    environment:
      POSTGRES_DB: pharmacy
      POSTGRES_USER: ${DB_USER:-pharmacy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d pharmacy']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:8.2.3-alpine
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy allkeys-lru']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4.2.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pharmacy}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    ports: [127.0.0.1:15672:15672]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped
  backend:
    build: ../backend
    image: pharmacy-backend:${APP_VERSION:-local}
    env_file: ../.env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pharmacy
      REDIS_HOST: redis
      REDIS_ENABLED: 'true'
      RABBITMQ_HOST: rabbitmq
      MESSAGING_ENABLED: 'true'
      PORT: 8080
    depends_on:
      postgres: {condition: service_healthy}
    ports: [127.0.0.1:8080:8080]
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8080/actuator/health/readiness || exit 1']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 20
    restart: unless-stopped
  frontend:
    build: ../frontend
    image: pharmacy-frontend:${APP_VERSION:-local}
    ports: [127.0.0.1:8088:8080]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://localhost:8080/health']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.8.0
    profiles: [monitoring]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../.runtime/metrics-token:/etc/prometheus/metrics-token:ro
      - prometheusdata:/prometheus
    ports: [127.0.0.1:9090:9090]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.3.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: [127.0.0.1:3001:3000]
    restart: unless-stopped
volumes:
  pgdata:
  rabbitdata:
  prometheusdata:
  grafanadata:
